<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="session-auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#101a24"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f9cf9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4f9cf9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#54d38a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fd0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="#1b2531" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300M900 0V300M1050 0V300"/>
  </g>
  <rect width="1200" height="3" fill="url(#glow)"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace">
    <text x="80" y="128" font-size="64" font-weight="700" fill="url(#text)" letter-spacing="-1">session-auto</text>
    <text x="82" y="172" font-size="21" fill="#8fa3b8">ChatGPT session token — extracted locally, in your own browser.</text>

    <g font-size="13" fill="#c8d6e5">
      <rect x="82" y="204" rx="14" width="150" height="28" fill="#12202e" stroke="#23384d"/>
      <text x="157" y="222" text-anchor="middle">0 dependencies</text>

      <rect x="244" y="204" rx="14" width="132" height="28" fill="#12202e" stroke="#23384d"/>
      <text x="310" y="222" text-anchor="middle">no network</text>

      <rect x="388" y="204" rx="14" width="170" height="28" fill="#12202e" stroke="#23384d"/>
      <text x="473" y="222" text-anchor="middle">runs in a browser</text>

      <rect x="570" y="204" rx="14" width="176" height="28" fill="#12202e" stroke="#23384d"/>
      <text x="658" y="222" text-anchor="middle">same-origin only</text>
    </g>
  </g>

  <g transform="translate(900,96)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
    <rect x="0" y="0" rx="12" width="228" height="108" fill="#0d151d" stroke="#1f2f3f"/>
    <circle cx="18" cy="17" r="4" fill="#f2555a"/>
    <circle cx="32" cy="17" r="4" fill="#f0b429"/>
    <circle cx="46" cy="17" r="4" fill="#54d38a"/>
    <text x="16" y="48" fill="#4f9cf9">GET</text>
    <text x="52" y="48" fill="#8fa3b8">/api/auth/session</text>
    <text x="16" y="74" fill="#54d38a">200</text>
    <text x="52" y="74" fill="#8fa3b8">{ accessToken: … }</text>
    <text x="16" y="96" fill="#5c6b7c">expires in 7d</text>
  </g>
</svg>